appId: com.sepia.notebook
productName: Sepia
copyright: Sepia

# 不设的话会从包名 @sepia/app 派生出 "@sepiaapp"，AppImage 拒收这种文件名。
executableName: sepia

directories:
  output: dist
  buildResources: build

# 双击 .md / 拖到应用图标（T-30 游离 page，120 §1.1 问题二在 Stage 6a 兑现）。
# 没有这一段，系统压根不会给我们发 `open-file`——main 里那个 handler 从 Stage 0
# 就在，但「代码在」不等于「功能在」。
# role: Editor 而不是 Viewer：Sepia 是编辑器，注册成查看器会让"打开方式"里排在后面。
fileAssociations:
  - ext:
      - md
      - markdown
    name: Markdown
    role: Editor
    mimeType: text/markdown

# 不带上包名 @sepia/app，否则产物会叫 "@sepia/app_0.0.0_amd64.deb"。
artifactName: ${productName}-${version}-${arch}.${ext}

files:
  - out/**/*
  - package.json

# 引擎产物走 extraResources 而不是 files：它必须落在 asar **之外**——
# sidecar 在运行期 `import` 那个单文件 ESM，且引擎按 `import.meta.url` 的相对路径
# 定位四份 wasm，asar 内的虚拟路径两件事都做不到（架构 §4.1）。
# supervisor 的 engineDir() 与这里一一对应：打包后取 process.resourcesPath/engine。
extraResources:
  - from: engine
    to: engine

# Day-1 不签名、不公证、不自动更新（架构 §1.3 非目标）。
# identity: null 让 electron-builder 别去钥匙串找证书，否则本地构建会挂。
mac:
  category: public.app-category.productivity
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Office
  # deb 必须有 maintainer，否则打包直接失败——这是 mac 绿、linux 红的原因。
  maintainer: OhBonsai <letbonsaibe@gmail.com>
  target:
    - AppImage
    - deb
