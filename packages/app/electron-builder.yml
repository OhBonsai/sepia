appId: com.sepia.notebook
productName: Sepia
copyright: Sepia

# 不设的话会从包名 @sepia/app 派生出 "@sepiaapp"，AppImage 拒收这种文件名。
executableName: sepia

directories:
  output: dist
  buildResources: build

# 不带上包名 @sepia/app，否则产物会叫 "@sepia/app_0.0.0_amd64.deb"。
artifactName: ${productName}-${version}-${arch}.${ext}

files:
  - out/**/*
  - package.json

# Day-1 不签名、不公证、不自动更新（架构 §1.3 非目标）。
# identity: null 让 electron-builder 别去钥匙串找证书，否则本地构建会挂。
mac:
  category: public.app-category.productivity
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Office
  # deb 必须有 maintainer，否则打包直接失败——这是 mac 绿、linux 红的原因。
  maintainer: OhBonsai <letbonsaibe@gmail.com>
  target:
    - AppImage
    - deb
