name: build

on:
  push:
    # 本仓库的默认分支是 master，不是 main。001 §5 写的「push main」指的是默认分支。
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 双 arch 在同一台机器上出（electron-builder.yml 里声明了 x64 + arm64）。
          - { os: macos-latest, name: macOS (x64 + arm64), targets: '--mac' }
          - { os: ubuntu-latest, name: Linux (AppImage + deb), targets: '--linux' }
          # Windows 原生出，不走 ubuntu + wine 交叉——见下方注释。
          - { os: windows-latest, name: Windows (nsis), targets: '--win' }
    env:
      # Day-1 不签名、不公证（架构 §1.3 非目标）。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run build

      # 001 §5 原定「ubuntu 出 linux + win」。实测下来 AppImage 与 deb 都能出，
      # 只有 nsis 在 ubuntu + wine 下失败，而 Actions 的日志匿名读不到，
      # 继续盲调 wine 只会反复烧 CI 轮次。改成原生 windows-latest：一处改动、
      # 把 wine 整个从图里去掉，代价只是多一台 runner（公开仓库免费）。
      - name: electron-builder
        working-directory: packages/app
        run: bunx electron-builder ${{ matrix.targets }} --publish never

      # always()：即使某个目标挂了，也把已经出来的产物传上去——
      # 产物清单（名字与大小）是公开可读的，这是另一条能看见真相的通道。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sepia-${{ matrix.os }}
          path: |
            packages/app/dist/*.dmg
            packages/app/dist/*.AppImage
            packages/app/dist/*.deb
            packages/app/dist/*.exe
          if-no-files-found: warn

  release:
    name: release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # main push 覆盖发 alpha-latest prerelease，tag 发正式 release，共用同一构建产物。
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'alpha-latest' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: artifacts/**
