name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI 恒忽略 SEPIA_HARNESS_BYPASS（002 §5.2）。这里显式清空，
  # 免得它从别处（比如 repository variables）漏进来。
  SEPIA_HARNESS_BYPASS: ''

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      # submodules: true —— Stage 3 起 check 里有 check:artifacts / check:patches，
      # 没有 vendor/opencode 这两条就只能报「submodule 不在」，等于空转。
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # vendor 的依赖缓存（140 §1.8 风险 3）：key 只认 vendor 的 lockfile。
      # 「构建期不依赖网络」的准确边界是**产物构建不出网**；依赖安装靠 lockfile 钉死
      # 加这层缓存兜底，温缓存下 bun install 一步不出网。
      - name: 缓存 vendor 依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: vendor-bun-${{ hashFiles('vendor/opencode/bun.lock') }}
          restore-keys: vendor-bun-

      - name: 构建引擎产物（check:artifacts 的被检对象）
        run: bun run build:engine

      # 唯一入口，与本地跑的是同一条命令（002 §3）。
      - run: bun run check

  build-smoke:
    name: build + 空窗口
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: 缓存 vendor 依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: vendor-bun-${{ hashFiles('vendor/opencode/bun.lock') }}
          restore-keys: vendor-bun-

      # prebuild 会驱动 build-engine（幂等：产物在且 commit 没变就跳过），
      # 所以这里不必显式再跑一次——smoke 要的引擎产物由它保证。
      - name: electron-vite 三段构建（prebuild 顺带出引擎产物）
        run: bun run build

      # Stage 1 起改用 Playwright `_electron`（001 §6 的测试表已定）。
      #
      # **它必须与人日常用的是同一条路径。** Stage 0 那版跑的是
      # `bunx electron out/main/index.js`，而 `bunx` 会触发 electron 的惰性下载并自愈，
      # 于是 CI 恒绿、且永远会绿——`bun run dev` 起不来它一次都抓不到（110 附录 A.6）。
      # 现在先跑 ensure-electron（与 dev / start 同一条），再由 Playwright 起应用。
      # 注意语法：`bun --filter <pkg> <script>`，**不带 run**——夹一个 run 进去会变成
      # "No packages matched the filter"（首次 push 就是这么红的，本地已复现）。
      - name: 确保 electron 二进制就位（与 dev / start 同一条路径）
        run: bun --filter @sepia/app ensure-electron

      - name: smoke —— 冷启动打点与首帧主题
        run: xvfb-run -a bun run test:smoke

      # Actions 日志匿名读不到，但 artifact 公开可下——smoke 失败时把 Playwright 的
      # error-context 传上来，失败详情就有了一条公开可读的通道（与 build.yml 的
      # 「产物清单是另一条能看见真相的通道」同一招）。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure-context
          path: test-results/
          if-no-files-found: ignore

      # check:artifacts（wasm 四份齐全、零 .node）已随 Stage 3 落地，跑在上面的
      # check job 里（引擎产物先建、再全量 check）。
