name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI 恒忽略 SEPIA_HARNESS_BYPASS（002 §5.2）。这里显式清空，
  # 免得它从别处（比如 repository variables）漏进来。
  SEPIA_HARNESS_BYPASS: ''

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # 唯一入口，与本地跑的是同一条命令（002 §3）。
      - run: bun run check

  build-smoke:
    name: build + 空窗口
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: electron-vite 三段构建
        run: bun run build

      # Stage 1 起改用 Playwright `_electron`（001 §6 的测试表已定）。
      #
      # **它必须与人日常用的是同一条路径。** Stage 0 那版跑的是
      # `bunx electron out/main/index.js`，而 `bunx` 会触发 electron 的惰性下载并自愈，
      # 于是 CI 恒绿、且永远会绿——`bun run dev` 起不来它一次都抓不到（110 附录 A.6）。
      # 现在先跑 ensure-electron（与 dev / start 同一条），再由 Playwright 起应用。
      # 注意语法：`bun --filter <pkg> <script>`，**不带 run**——夹一个 run 进去会变成
      # "No packages matched the filter"（首次 push 就是这么红的，本地已复现）。
      - name: 确保 electron 二进制就位（与 dev / start 同一条路径）
        run: bun --filter @sepia/app ensure-electron

      - name: smoke —— 冷启动打点与首帧主题
        run: xvfb-run -a bun run test:smoke

      # Actions 日志匿名读不到，但 artifact 公开可下——smoke 失败时把 Playwright 的
      # error-context 传上来，失败详情就有了一条公开可读的通道（与 build.yml 的
      # 「产物清单是另一条能看见真相的通道」同一招）。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure-context
          path: test-results/
          if-no-files-found: ignore

      # check:artifacts（wasm 四份齐全、零 .node）随 Stage 3 的 vendor 构建一起加，
      # 现在没有 vendor 产物可查，加了也抓不到东西（002 §6.2）。
